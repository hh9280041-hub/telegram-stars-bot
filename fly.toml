# fly.toml app configuration file generated for telegram-stars-bot-oej19g on 2026-11-02T20:56:04Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'telegram-stars-bot-oej19g'
primary_region = 'ams'

[build]
  builder = 'paketobuildpacks/builder:base'

[processes]
  app = 'python bot.py'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
